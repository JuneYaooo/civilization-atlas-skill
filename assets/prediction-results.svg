<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" role="img" aria-labelledby="title desc"><title id="title">历史回放结果</title><desc id="desc">五年线性外推基线：中国城市化方向相符，日本人口与巴西实际人均 GDP 方向失败。不是 Skill 事前预测成绩。</desc><defs>
 <radialGradient id="ambient"><stop stop-color="#263789" stop-opacity=".65"/><stop offset="1" stop-color="#050813" stop-opacity="0"/></radialGradient>
