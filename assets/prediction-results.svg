t-weight="500" text-anchor="start" >8,435.01</text><text x="734" y="685" font-size="19" fill="#9DAFC9" font-weight="400" text-anchor="start" >绝对误差  675.42 美元</text><path d="M1134 623L1300 571" fill="none" stroke="#7795FF" stroke-opacity="1" stroke-width="2"/><path d="M1134 623L1300 658" fill="none" stroke="#FF9D8E" stroke-opacity="1" stroke-width="2"/><circle cx="1134" cy="623" r="4" fill="#9DAFC9"/><text x="1320" y="689" font-size="13" fill="#9DAFC9" font-weight="400" text-anchor="end" >方向示意</text><text x="72" y="767" font-size="21" fill="#9DAFC9" font-weight="400" text-anchor="start" >外推：截点前五年线性趋势  /  结果：五年后观测值</text><text x="72" y="809" font-size="18" fill="#9DAFC9" font-weight="400" text-anchor="start" >固定展示题，非随机样本。数据：WDI 修订快照；GDP 单位为 2015 年不变价美元。</text><text x="1368" y="850" font-size="13" fill="#60F4E5" font-weight="400" text-anchor="end" >BASELINE REPLAY / 3 CASES</text></g></svg>
