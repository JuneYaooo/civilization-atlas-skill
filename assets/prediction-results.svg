<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc"><title id="title">预测检验：同时展示命中、失败与待验证</title><desc id="desc">三项五年线性外推历史回放：中国城市化方向相符，日本人口和巴西人均GDP方向失败。另列外部预测误差和未来待结算题。</desc><defs><radialGradient id="a"><stop stop-color="#174745" stop-opacity=".55"/><stop offset="1" stop-color="#080f1b" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8abac9" stroke-opacity=".045"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#67e8cf" stroke-width="1.2"/></marker></defs><rect width="1280" height="650" rx="24" fill="#080f1b"/><rect width="1280" height="650" rx="24" fill="url(#grid)"/><ellipse cx="1120" cy="100" rx="550" ry="400" fill="url(#a)"/><g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><text x="64" y="54" fill="#67e8cf" font-size="17" font-weight="500" letter-spacing="3">EVALUATION / 02</text><text x="64" y="110" fill="#eff5f8" font-size="40" font-weight="600" >把命中与失败，放在同一张桌上。</text><text x="64" y="152" fill="#94aabd" font-size="22" font-weight="400" >以下三题为数值基线的历史重建，不是 Skill 事前预测成绩。</text><rect x="64" y="193" width="350" height="274" rx="16" fill="#101d2c" stroke="#284154" stroke-opacity=".8"/><text x="88" y="231" fill="#eff5f8" font-size="24" font-weight="600" >中国 · 城市化</text><text x="88" y="264" fill="#94aabd" font-size="18" font-weight="400" >2010 → 2015</text><text x="88" y="305" fill="#67e8cf" font-size="20" font-weight="500" >方向相符</text><text x="88" y="341" fill="#94aabd" font-size="18" font-weight="400" >外推</text><text x="176" y="343" fill="#eff5f8" font-size="30" font-weight="500" >55.52%</text><text x="88" y="382" fill="#94aabd" font-size="18" font-weight="400" >结果</text><text x="176" y="384" fill="#67e8cf" font-size="30" font-weight="500" >57.33%</text><text x="88" y="434" fill="#94aabd" font-size="18" font-weight="400" >误差 1.81 个百分点</text><rect x="465" y="193" width="350" height="274" rx="16" fill="#101d2c" stroke="#284154" stroke-opacity=".8"/><text x="489" y="231" fill="#eff5f8" font-size="24" font-weight="600" >日本 · 人口</text><text x="489" y="264" fill="#94aabd" font-size="18" font-weight="400" >2010 → 2015</text><text x="489" y="305" fill="#f3a295" font-size="20" font-weight="500" >方向失败</text><text x="489" y="341" fill="#94aabd" font-size="18" font-weight="400" >外推</text><text x="577" y="343" fill="#eff5f8" font-size="30" font-weight="500" >1.2834 亿</text><text x="489" y="382" fill="#94aabd" font-size="18" font-weight="400" >结果</text><text x="577" y="384" fill="#f3a295" font-size="30" font-weight="500" >1.2714 亿</text><text x="489" y="434" fill="#94aabd" font-size="18" font-weight="400" >误差约 120.06 万人</text><rect x="866" y="193" width="350" height="274" rx="16" fill="#101d2c" stroke="#284154" stroke-opacity=".8"/><text x="890" y="231" fill="#eff5f8" font-size="24" font-weight="600" >巴西 · 实际人均 GDP</text><text x="890" y="264" fill="#94aabd" font-size="18" font-weight="400" >2015 → 2020</text><text x="890" y="305" fill="#f3a295" font-size="20" font-weight="500" >方向失败</text><text x="890" y="341" fill="#94aabd" font-size="18" font-weight="400" >外推</text><text x="978" y="343" fill="#eff5f8" font-size="30" font-weight="500" >9,110.43</text><text x="890" y="382" fill="#94aabd" font-size="18" font-weight="400" >结果</text><text x="978" y="384" fill="#f3a295" font-size="30" font-weight="500" >8,435.01</text><text x="890" y="434" fill="#94aabd" font-size="18" font-weight="400" >误差 675.42 美元</text><path d="M64 505H1216" stroke="#284154"/><text x="64" y="548" fill="#ecc27d" font-size="19" font-weight="400" >外部事前预测</text><text x="275" y="548" fill="#eff5f8" font-size="22" font-weight="400" >英国 2024 BEV：22.3% → 19.6% ｜ 高估 2.7 个百分点</text><text x="64" y="591" fill="#92b9ff" font-size="19" font-weight="400" >未来问题登记</text><text x="275" y="591" fill="#94aabd" font-size="22" font-weight="400" >四国 2027 Q1 BEV 份额 ｜ 尚未提交预测，尚未结算</text><text x="64" y="630" fill="#94aabd" font-size="16" font-weight="400" >回放数据：WDI 修订快照；巴西单位：2015 年不变价美元。外部预测：SMMT。</text></g></svg>
