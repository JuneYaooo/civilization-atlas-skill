 </defs><rect width="1440" height="880" rx="28" fill="#050813"/><rect width="1440" height="880" rx="28" fill="url(#grid)"/><ellipse cx="1060" cy="240" rx="650" ry="480" fill="url(#ambient)"/>
 <path d="M32 78V32H78 M1362 32H1408V78 M32 802V848H78 M1362 848H1408V802" stroke="#6478A6" stroke-opacity=".5" fill="none"/>
 <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><text x="72" y="78" font-size="18" fill="#60F4E5" font-weight="400" text-anchor="start" >02 / EVALUATION</text><text x="72" y="140" font-size="43" fill="#F0F5FF" font-weight="600" text-anchor="start" >预测与实际，在哪里分叉</text><text x="72" y="184" font-size="22" fill="#9DAFC9" font-weight="400" text-anchor="start" >数值基线的历史重建，不是 Skill 事前预测成绩。</text><rect x="72" y="224" width="608" height="490" rx="24" fill="url(#plate)" stroke="#5BA99C" stroke-opacity=".4"/><text x="104" y="269" font-size="28" fill="#F0F5FF" font-weight="600" text-anchor="start" >中国 · 城市化</text><text x="104" y="303" font-size="17" fill="#9DAFC9" font-weight="400" text-anchor="start" >2010 → 2015</text><text x="644" y="269" font-size="20" fill="#60F4E5" font-weight="400" text-anchor="end" >方向相符</text><path d="M125 589L505 451" fill="none" stroke="#7795FF" stroke-opacity="1" stroke-width="2"/><path d="M125 589L505 411" fill="none" stroke="#60F4E5" stroke-opacity="1" stroke-width="3"/><path d="M125 589L505 411" fill="none" stroke="#60F4E5" stroke-width="12" opacity=".25" filter="url(#glow)"/><circle cx="125" cy="589" r="5" fill="#9DAFC9"/><circle cx="505" cy="451" r="5" fill="#7795FF"/><circle cx="505" cy="411" r="5" fill="#60F4E5"/><text x="105" y="627" font-size="18" fill="#9DAFC9" font-weight="400" text-anchor="start" >起点 49.23%</text><text x="506" y="380" font-size="23" fill="#60F4E5" font-weight="400" text-anchor="middle" >实际 57.33%</text><text x="506" y="487" font-size="22" fill="#7795FF" font-weight="400" text-anchor="middle" >外推 55.52%</text><path d="M106 650L644 650" fill="none" stroke="#7795FF" stroke-opacity="0.2" stroke-width="1"/><text x="105" y="688" font-size="18" fill="#9DAFC9" font-weight="400" text-anchor="start" >绝对误差</text><text x="644" y="689" font-size="27" fill="#F0F5FF" font-weight="500" text-anchor="end" >1.81 个百分点</text><rect x="704" y="224" width="664" height="236" rx="24" fill="url(#plate)" stroke="#778BB