 <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#69FBE7"/><stop offset=".5" stop-color="#6776F8"/><stop offset="1" stop-color="#B5A2FF"/></linearGradient>
 <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#15243A"/><stop offset="1" stop-color="#080E1C"/></linearGradient>
 <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
 <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="24"/></filter>
