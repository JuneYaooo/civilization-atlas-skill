</text><text x="1042" y="200" fill="#67e8cf" font-size="12" font-weight="400" text-anchor="middle" letter-spacing="1">PAST → POSSIBLE</text><path d="M64 330H1216" stroke="#284154"/><text x="64" y="375" fill="#67e8cf" font-size="17" font-weight="400" >01  EVIDENCE</text><text x="390" y="375" fill="#67e8cf" font-size="17" font-weight="400" >02  MECHANISMS</text><text x="770" y="375" fill="#ecc27d" font-size="17" font-weight="400" >03  FUTURES</text><text x="1155" y="375" fill="#94aabd" font-size="15" font-weight="400" text-anchor="end">循证 · 求变</text></g></svg>
