<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="750" viewBox="0 0 1280 750" role="img" aria-labelledby="title desc"><title id="title">从证据到可检验判断</title><desc id="desc">问题定义、事实与历史检索、机制与条件比较、情景和行动、冻结判断、结果复盘；新证据反馈到下一轮。</desc><defs><radialGradient id="a"><stop stop-color="#174745" stop-opacity=".55"/><stop offset="1" stop-color="#080f1b" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8abac9" stroke-opacity=".045"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#67e8cf" stroke-width="1.2"/></marker></defs><rect width="1280" height="750" rx="24" fill="#080f1b"/><rect width="1280" height="750" rx="24" fill="url(#grid)"/><ellipse cx="1120" cy="100" rx="550" ry="400" fill="url(#a)"/><g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><text x="64" y="56" fill="#67e8cf" font-size="17" font-weight="500" letter-spacing="3">RESEARCH ENGINE / 01</text><text x="64" y="114" fill="#eff5f8" font-size="40" font-weight="600" >从问题到预测的研究流程</text><text x="64" y="157" fill="#94aabd" font-size="22" font-weight="400" >证据 → 条件 → 判断 → 复盘</text><rect x="64" y="210" width="350" height="150" rx="16" fill="#101d2c" stroke="#284154" stroke-opacity=".8"/><text x="88" y="247" fill="#67e8cf" font-size="18" font-weight="400" >01</text><text x="136" y="249" fill="#eff5f8" font-size="26" font-weight="600" >定义问题</text><text x="88" y="295" fill="#94aabd" font-size="21" font-weight="400" >结果、主体、期限与损失</text><text x="88" y="329" fill="#94aabd" font-size="20" font-weight="400" >先确定什么能被检验</text><rect x="465" y="210" width="350" height="150" rx="16" fill="#101d2c" stroke="#284154" stroke-opacity=".8"/><text x="489" y="247" fill="#67e8cf" font-size="18" font-weight="400" >02</text><text x="537" y="249" fill="#eff5f8" font-size="26" font-weight="600" >双向取证</text><text x="489" y="295" fill="#94aabd" font-size="21" font-weight="400" >当下事实 × 历史对照</text><text x="489" y="329" fill="#94aabd" font-size="20" font-weight="400" >补查反例、来源与版本</text><rect x="866" y="210" width="350" height="150" rx="16" fill="#101d2c" stroke="#284154" stroke-opacity=".8"/><text x="890" y="247" fill="#67e8cf" font-size="18" font-weight="400" >03</text><text x="938" y="249" fill="#eff5f8" font-size="26" font-weight="600" >比较机制</text><text x="890" y="295" fill="#94aabd" font-size="21" font-weight="400" >旧约束 × 时代条件</text><text x="890" y="329" fill="#94aabd" font-size="20" font-weight="400" >辨认瓶颈、时滞与反馈</text><rect x="866" y="430" width="350" height="150" rx="16" fill="#101d2c" stroke="#284154" stroke-opacity=".8"/><text x="890" y="467" fill="#67e8cf" font-size="18" font-weight="400" >04</text><text x="938" y="469" fill="#eff5f8" font-size="26" font-weight="600" >形成判断</text><text x="890" y="515" fill="#94aabd" font-size="21" font-weight="400" >竞争路径 × 可行行动</text><text x="890" y="549" fill="#94aabd" font-size="20" font-weight="400" >写出成立条件与撤回信号</text><rect x="465" y="430" width="350" height="150" rx="16" fill="#101d2c" stroke="#284154" stroke-opacity=".8"/><text x="489" y="467" fill="#67e8cf" font-size="18" font-weight="400" >05</text><text x="537" y="469" fill="#eff5f8" font-size="26" font-weight="600" >冻结与登记</text><text x="489" y="515" fill="#94aabd" font-size="21" font-weight="400" >信息截点 × 简单基线</text><text x="489" y="549" fill="#94aabd" font-size="20" font-weight="400" >保留未知，不回写旧结论</text><rect x="64" y="430" width="350" height="150" rx="16" fill="#101d2c" stroke="#284154" stroke-opacity=".8"/><text x="88" y="467" fill="#67e8cf" font-size="18" font-weight="400" >06</text><text x="136" y="469" fill="#eff5f8" font-size="26" font-weight="600" >结算与修订</text><text x="88" y="515" fill="#94aabd" font-size="21" font-weight="400" >结果 × 误差 × 行动成本</text><text x="88" y="549" fill="#94aabd" font-size="20" font-weight="400" >区分命中、失败与未结算</text><path d="M415 285H453" fill="none" stroke="#67e8cf" stroke-width="2" marker-end="url(#arrow)"/><path d="M816 285H854" fill="none" stroke="#67e8cf" stroke-width="2" marker-end="url(#arrow)"/><path d="M1041 361V418" fill="none" stroke="#67e8cf" stroke-width="2" marker-end="url(#arrow)"/><path d="M865 505H828" fill="none" stroke="#67e8cf" stroke-width="2" marker-end="url(#arrow)"/><path d="M464 505H426" fill="none" stroke="#67e8cf" stroke-width="2" marker-end="url(#arrow)"/><path d="M64 505H30V184H641V199" fill="none" stroke="#67e8cf" stroke-opacity=".45" stroke-dasharray="5 6" marker-end="url(#arrow)"/><path d="M64 626H1216" stroke="#284154"/><text x="64" y="670" fill="#67e8cf" font-size="25" font-weight="500" >根据实际结果，修订下一次判断。</text><text x="64" y="710" fill="#94aabd" font-size="20" font-weight="400" >历史可提供机制与边界；预测增益仍须与同题基线比较。</text></g></svg>
