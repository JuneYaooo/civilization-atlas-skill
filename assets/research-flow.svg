<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc"><title id="title">研究流程</title><desc id="desc">六个步骤顺时针排列：定义问题、核实资料、比较条件、形成判断、登记预测、检验修订。中央连接历史与现实。</desc><defs>
