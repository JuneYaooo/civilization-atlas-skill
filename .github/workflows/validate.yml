name: Validate pure-method distribution
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_distribution.py
      - run: python -m py_compile scripts/forecast_registry.py
      - run: python scripts/forecast_registry.py --help
      - run: python scripts/install_skill.py --zip dist/civilization-atlas.zip
